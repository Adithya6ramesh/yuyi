[pytest]
# Tests live in backend/tests/. "pythonpath = ." lets tests import our "app" package.
testpaths = tests
pythonpath = .
# The test client warns that it would prefer a newer helper package (httpx2); the
# current one (httpx) works fine, so we hide that one warning.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
