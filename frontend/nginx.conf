# nginx settings for the frontend container.
# It does two jobs:
#   1. serve the built React app (and send unknown paths like /desk to index.html,
#      so refreshing /desk works - React Router then shows the right page)
#   2. forward /api/... (and the API's /docs page) to the backend container

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Shrink text files before sending them.
    gzip on;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    # --- 2. the backend ("backend" is its name in docker-compose.yml) ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    # The API's interactive docs page ("Try it out") and the description it reads.
    location = /docs {
        proxy_pass http://backend:8000;
    }
    location = /openapi.json {
        proxy_pass http://backend:8000;
    }

    # --- 1. the React app ---
    # Built files have a fingerprint in their name, so browsers may keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Everything else: the file if it exists, otherwise index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
