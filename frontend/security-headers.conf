# Security headers sent with every response (the same ones as backend/vercel.json).
# Included from nginx.conf. Kept in one file because nginx forgets server-wide
# add_header lines inside any location that sets its own headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
